# Run `portler up -d`; the pairing URL is in `portler logs server`.
# Stop this checkout's stack with `portler down`; data stays in .t3/portler.
services:
  server:
    command: node scripts/dev-runner.ts dev:server --home-dir .t3/portler --no-seed --dev-url "$VITE_DEV_SERVER_URL"
    port: 13773
    port_env: T3CODE_PORT
    env:
      T3CODE_HOST: 127.0.0.1
      T3CODE_MODE: web
      VITE_DEV_SERVER_URL: web.url

  web:
    command: ../../node_modules/.bin/vp dev --host 127.0.0.1 --strictPort
    cwd: apps/web
    port: 5733
    port_env: PORT
    depends_on:
      - server
    env:
      # Bind through the CLI; HOST would also pin HMR for remote browsers.
      HOST: ""
      T3CODE_PORT: server.port
      T3CODE_SINGLE_ORIGIN_DEV: "1"
