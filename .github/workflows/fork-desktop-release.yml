name: T3 Dulli Release

# Dulli releases are explicit and isolated from upstream's release, relay, and
# EAS workflows. Keeping this filename preserves npm trusted-publisher identity.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "T3 Dulli version (0.<minor>.<patch>-dulli.<build>, e.g. 0.1.9-dulli.1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    if: github.repository == 'YJJosh/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      ref: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - id: release_meta
        name: Validate release version
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-dulli\.(0|[1-9][0-9]*)$ ]]; then
            echo "Fork releases require the 0.<minor>.<patch>-dulli.<build> sequence." >&2
            exit 1
          fi
          # Android shares the release version and must never overflow or reuse a slot.
          base="${version%-*}"
          minor="${base#0.}"
          minor="${minor%%.*}"
          patch="${base##*.}"
          build="${version##*.}"
          if (( ${#minor} > 3 || ${#patch} > 3 || ${#build} > 4 )); then
            echo "Release exceeds Android versionCode slots (patch <= 999, build <= 9999)." >&2
            exit 1
          fi
          version_code=$(( (minor * 1000 + patch) * 10000 + build ))
          if (( version_code > 2100000000 )); then
            echo "Release exceeds Android's maximum versionCode of 2100000000." >&2
            exit 1
          fi
          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Release notes compare against the previous Dulli tag. GitHub's own guess
      # can land on upstream tags that this fork also carries.
      - id: previous_tag
        name: Resolve previous Dulli tag
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          previous_tag="$(
            { git tag --list 'v*-dulli.*'; printf '%s\n' "$CURRENT_TAG"; } |
              sort -V |
              awk -v tag="$CURRENT_TAG" '$0 == tag { print previous; exit } { previous = $0 }'
          )"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Test release integrations
        run: |
          vp test run \
            scripts/fork-release-workflows.test.ts \
            scripts/build-desktop-artifact.test.ts \
            scripts/build-cli-archive.test.ts \
            scripts/build-npm-launcher.test.ts \
            scripts/extract-android-cert-sha256.test.ts \
            apps/desktop/src/app/DesktopEnvironment.test.ts \
            apps/desktop/src/app/DesktopUserData.test.ts \
            apps/desktop/src/electron/ElectronProtocol.test.ts \
            apps/desktop/src/updates/DesktopUpdates.test.ts \
            apps/web/src/branding.test.ts \
            apps/mobile/plugins/withAndroidReleaseSigning.test.ts \
            apps/mobile/scripts/dulli-fork-version.test.ts

  build_bundle:
    name: Build branded JS bundle
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_DESKTOP_BUILD_BRAND: dulli
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # @t3tools/desktop#build compiles the Linux browser secret helper, which
      # needs libsecret headers.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: dulli-js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  build_cli:
    name: CLI ${{ matrix.key }}
    needs: [preflight, build_bundle]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              runner: ubuntu-24.04,
              platform: linux,
              arch: x64,
              key: linux-x64,
              rust: x86_64-unknown-linux-gnu,
            }
          - {
              runner: ubuntu-24.04-arm,
              platform: linux,
              arch: arm64,
              key: linux-arm64,
              rust: aarch64-unknown-linux-gnu,
            }
          - {
              runner: macos-26,
              platform: mac,
              arch: arm64,
              key: darwin-arm64,
              rust: aarch64-apple-darwin,
            }
          - {
              runner: windows-2025,
              platform: win,
              arch: x64,
              key: win32-x64,
              rust: x86_64-pc-windows-msvc,
            }
          - {
              runner: windows-11-arm,
              platform: win,
              arch: arm64,
              key: win32-arm64,
              rust: aarch64-pc-windows-msvc,
            }
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: ./.github/actions/setup-ci-deps
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - name: Align versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
      - uses: actions/download-artifact@v8
        with:
          name: dulli-js-bundle
          path: apps
      - name: Apply Dulli icons
        run: node scripts/apply-web-brand-assets.ts dulli apps/server/dist/client
      - name: Build executable with pinned Node
        run: node apps/server/scripts/cli.ts build-exe --verbose
      - name: Build resource monitor
        run: cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.rust }}
      - name: Assemble and smoke-test archive
        shell: bash
        run: |
          set -euo pipefail
          binary="t3-resource-monitor"
          ext="tar.gz"
          if [[ "${{ matrix.platform }}" == "win" ]]; then binary="$binary.exe"; ext="zip"; fi
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.key }}"
          cp "native/resource-monitor/target/${{ matrix.rust }}/release/$binary" "$RUNNER_TEMP/cli-resource-monitor/${{ matrix.key }}/$binary"
          node scripts/build-cli-archive.ts --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-${{ needs.preflight.outputs.version }}-${{ matrix.key }}.$ext" --expect-version "${{ needs.preflight.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.key }}
          path: release-cli/t3-*
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    # Matrix jobs share needs; only Windows downloads/embeds the Linux archive.
    needs: [preflight, build_bundle, build_cli]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
          - label: macOS x64
            runner: macos-26
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      T3CODE_DESKTOP_UPDATE_REPOSITORY: YJJosh/t3code
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Import persistent macOS community signing certificate
        if: matrix.platform == 'mac'
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DULLI_MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DULLI_MACOS_CERTIFICATE_PASSWORD }}
          EXPECTED_CERTIFICATE_SHA1: ${{ vars.DULLI_MACOS_CERTIFICATE_SHA1 }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_P12_BASE64" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "DULLI_MACOS_CERTIFICATE_P12_BASE64 and DULLI_MACOS_CERTIFICATE_PASSWORD must be configured as repository secrets." >&2
            exit 1
          fi
          expected_identity="$(printf '%s' "$EXPECTED_CERTIFICATE_SHA1" | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected_identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "DULLI_MACOS_CERTIFICATE_SHA1 must be configured as a 40-character repository variable." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/t3-dulli-community-signing.p12"
          certificate_pem_path="$RUNNER_TEMP/t3-dulli-community-signing.pem"
          keychain_path="$RUNNER_TEMP/t3-dulli-community-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          echo "DULLI_MACOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          cleanup_sensitive_files() {
            rm -f "$certificate_path" "$certificate_pem_path"
          }
          trap cleanup_sensitive_files EXIT

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          # The certificate uses RC2; OpenSSL 3 (newer runner images) reads it only with -legacy.
          read_certificate() {
            openssl pkcs12 "$@" -in "$certificate_path" -clcerts -nokeys \
              -passin env:CERTIFICATE_PASSWORD -out "$certificate_pem_path"
          }
          read_certificate 2>/dev/null || read_certificate -legacy

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -x \
            -T /usr/bin/codesign
          echo "Imported the non-extractable community signing identity."

          # User-domain trust opens SecurityAgent and hangs on headless GitHub runners. The
          # runners provide passwordless sudo, so install only the public certificate in the
          # ephemeral VM's admin trust domain and remove it immediately after verification.
          sudo -n security add-trusted-cert \
            -d \
            -r trustRoot \
            -p codeSign \
            -k /Library/Keychains/System.keychain \
            "$certificate_pem_path"
          echo "Trusted the community certificate for code signing on this ephemeral runner."

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path" >/dev/null

          current_keychains=()
          while IFS= read -r current_keychain; do
            current_keychain="${current_keychain#*\"}"
            current_keychain="${current_keychain%\"*}"
            if [[ -n "$current_keychain" ]]; then
              current_keychains+=("$current_keychain")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain_path" "${current_keychains[@]}"

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          identity_count="$(printf '%s\n' "$identities" | awk '/^[[:space:]]*[0-9]+\)/ { count++ } END { print count + 0 }')"
          if [[ "$identity_count" != "1" ]]; then
            echo "Expected exactly one valid code-signing identity in the community signing certificate; found $identity_count." >&2
            exit 1
          fi
          identity="$(printf '%s\n' "$identities" | awk '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
          if [[ ! "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "Could not resolve the community signing certificate SHA-1 identity." >&2
            exit 1
          fi
          if [[ "$identity" != "$expected_identity" ]]; then
            echo "The imported community signing certificate does not match DULLI_MACOS_CERTIFICATE_SHA1." >&2
            exit 1
          fi

          echo "T3CODE_MACOS_COMMUNITY_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Download Linux CLI archive for WSL
        if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x64
          path: wsl-runtime

      - name: Install Spectre-mitigated MSVC libraries
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            throw "Visual Studio Installer failed with exit code $code"
          }

      # The Linux artifact compiles the browser import secret helper against
      # the host's libsecret during packaging.
      - name: Install Linux desktop build libraries
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get install -y imagemagick
          fi

      - name: Download JS bundle
        uses: actions/download-artifact@v8
        with:
          name: dulli-js-bundle
          path: apps

      - name: Build desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == "mac" ]]; then ulimit -n 65536; fi
          args=(
            --brand dulli
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --skip-build
            --verbose
          )
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            args+=(--wsl-runtime "$GITHUB_WORKSPACE/wsl-runtime/t3-${{ needs.preflight.outputs.version }}-linux-${{ matrix.arch }}.tar.gz")
          fi
          vp run dist:desktop:artifact "${args[@]}"

      - name: Verify macOS app signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.preflight.outputs.version }}"
          dmg="release/T3-Dulli-${version}-${{ matrix.arch }}.dmg"
          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point" >/dev/null
          app="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          signature="$(codesign --display --verbose=4 "$app" 2>&1)"
          requirement="$(codesign --display --requirements - "$app" 2>&1)"
          identity_lower="$(printf '%s' "$T3CODE_MACOS_COMMUNITY_SIGNING_IDENTITY" | tr '[:upper:]' '[:lower:]')"
          printf '%s\n' "$signature" | grep -q 'Identifier=com.yjjosh.t3dulli'
          printf '%s\n' "$signature" | grep -q 'Authority=T3 Dulli Community Code Signing'
          printf '%s\n' "$requirement" | grep -Fq \
            "identifier \"com.yjjosh.t3dulli\" and certificate root = H\"$identity_lower\""

      - name: Remove macOS private-key keychain
        if: always() && matrix.platform == 'mac'
        shell: bash
        run: |
          if [[ -n "${DULLI_MACOS_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$DULLI_MACOS_SIGNING_KEYCHAIN" || true
          fi

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.deb" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            for manifest in release-publish/*-mac.yml; do
              mv "$manifest" "${manifest%.yml}-${{ matrix.arch }}.yml"
            done
          fi

          if [[ -z "$(find release-publish -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No release assets were produced." >&2
            exit 1
          fi

          version="${{ needs.preflight.outputs.version }}"
          case "${{ matrix.platform }}" in
            mac)
              test -s "release-publish/T3-Dulli-${version}-${{ matrix.arch }}.dmg"
              test -s "release-publish/T3-Dulli-${version}-${{ matrix.arch }}.zip"
              if [[ "${{ matrix.arch }}" == "arm64" ]]; then
                test -s "release-publish/latest-mac.yml"
              else
                test -s "release-publish/latest-mac-${{ matrix.arch }}.yml"
              fi
              ;;
            linux)
              test -s "release-publish/T3-Dulli-${version}-x86_64.AppImage"
              compgen -G "release-publish/T3-Dulli-${version}-*.deb" >/dev/null
              test -s "release-publish/latest-linux.yml"
              ;;
            win)
              test -s "release-publish/T3-Dulli-${version}-x64.exe"
              test -s "release-publish/latest.yml"
              ;;
          esac

          for manifest in release-publish/latest*.yml; do
            grep -q 'T3-Dulli-' "$manifest" || {
              echo "Updater manifest does not reference a branded Dulli artifact: $manifest" >&2
              exit 1
            }
          done

      - name: Collect resource monitor
        shell: bash
        run: |
          set -euo pipefail
          binary_name="t3-resource-monitor"
          if [[ "${{ matrix.platform }}" == "win" ]]; then
            binary_name="${binary_name}.exe"
          fi
          source_path="native/resource-monitor/target/${{ matrix.rust_target }}/release/${binary_name}"
          target_dir="resource-monitor-publish/${{ matrix.resource_key }}"
          mkdir -p "$target_dir"
          cp "$source_path" "$target_dir/$binary_name"

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

      - name: Upload resource monitor
        uses: actions/upload-artifact@v7
        with:
          name: resource-monitor-${{ matrix.resource_key }}
          path: resource-monitor-publish/${{ matrix.resource_key }}/*
          if-no-files-found: error

  publish_cli:
    name: Publish t3-dulli to npm
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: ./.github/actions/setup-ci-deps
      - name: Build launcher package
        run: node scripts/build-npm-launcher.ts --version "${{ needs.preflight.outputs.version }}" --output-dir npm-packages
      - name: Publish after release assets exist
        run: node apps/server/scripts/cli.ts publish --packages-dir npm-packages --tag latest --provenance --verbose

  build_android:
    name: Build Android APK
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VARIANT: production
      EXPO_PUBLIC_T3CODE_MOBILE_BRAND: dulli
      MOBILE_VERSION_POLICY: appVersion
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=8192
      T3CODE_MOBILE_FORK_BRAND: dulli
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      T3CODE_MOBILE_FORK_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...

      - name: Expose pnpm
        run: |
          pnpm_version="$(node --print "require('./package.json').packageManager.split('@').pop()")"
          vp_pnpm_bin="$HOME/.vite-plus/package_manager/pnpm/$pnpm_version/pnpm/bin"
          echo "$vp_pnpm_bin" >> "$GITHUB_PATH"
          "$vp_pnpm_bin/pnpm" --version

      - name: Verify Dulli Expo identity
        shell: bash
        run: |
          set -euo pipefail
          config_path="$RUNNER_TEMP/t3-dulli-expo-config.json"
          (cd apps/mobile && ./node_modules/.bin/expo config --json) > "$config_path"
          CONFIG_PATH="$config_path" node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { resolveDulliForkVersion } from "./apps/mobile/scripts/dulli-fork-version.ts";

          const config = JSON.parse(fs.readFileSync(process.env.CONFIG_PATH, "utf8"));
          const failures = [
            [config.name === "T3 Dulli", "app name"],
            [config.scheme === "t3dulli", "URL scheme"],
            [config.version === process.env.T3CODE_MOBILE_FORK_VERSION, "version name"],
            [config.android?.package === "com.yjjosh.t3dulli", "Android package"],
            [config.android?.versionCode === resolveDulliForkVersion(process.env.T3CODE_MOBILE_FORK_VERSION).versionCode, "Android versionCode"],
            [config.updates?.enabled === false, "disabled OTA updates"],
            [config.extra?.appBrand === "dulli", "runtime app brand"],
            [config.owner === undefined, "omitted upstream EAS owner"],
            [config.extra?.eas?.projectId === undefined, "omitted upstream EAS project"],
          ].filter(([ok]) => !ok);

          if (failures.length > 0) {
            throw new Error(`Invalid Dulli Expo config: ${failures.map(([, label]) => label).join(", ")}`);
          }
          NODE

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Import Android release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DULLI_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DULLI_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DULLI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DULLI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "DULLI_ANDROID_KEYSTORE_BASE64, DULLI_ANDROID_KEYSTORE_PASSWORD, DULLI_ANDROID_KEY_ALIAS, and DULLI_ANDROID_KEY_PASSWORD must be configured as repository secrets." >&2
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/t3-dulli-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          {
            echo "T3CODE_ANDROID_RELEASE_KEYSTORE=$keystore_path"
            echo "T3CODE_ANDROID_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "T3CODE_ANDROID_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "T3CODE_ANDROID_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Prebuild Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: "1"
        run: ./node_modules/.bin/expo prebuild --clean --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK identity and signature
        shell: bash
        env:
          EXPECTED_CERT_SHA256: ${{ vars.DULLI_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$EXPECTED_CERT_SHA256" ]]; then
            echo "DULLI_ANDROID_CERT_SHA256 must be configured as a repository variable." >&2
            exit 1
          fi
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='com.yjjosh.t3dulli'"
          printf '%s\n' "$badging" | grep -F "versionName='${{ needs.preflight.outputs.version }}'"
          version_code="$(node --input-type=module -e 'import { resolveDulliForkVersion } from "./apps/mobile/scripts/dulli-fork-version.ts"; console.log(resolveDulliForkVersion(process.env.T3CODE_MOBILE_FORK_VERSION).versionCode)')"
          printf '%s\n' "$badging" | grep -F "versionCode='$version_code'"
          certs="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$certs"
          actual_cert_sha256="$(
            printf '%s\n' "$certs" |
              node scripts/extract-android-cert-sha256.ts
          )"
          expected_cert_sha256="$(
            printf '%s' "$EXPECTED_CERT_SHA256" |
              sed 's/^[[:space:]]*SHA256:[[:space:]]*//I' |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          if [[ -z "$actual_cert_sha256" || "$actual_cert_sha256" != "$expected_cert_sha256" ]]; then
            echo "Android signer fingerprint mismatch." >&2
            echo "Expected: $expected_cert_sha256" >&2
            echo "Actual:   ${actual_cert_sha256:-missing}" >&2
            exit 1
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "release-publish/T3-Dulli-${{ needs.preflight.outputs.version }}-android.apk"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-android
          path: release-publish/*.apk
          if-no-files-found: error

  release:
    name: Publish T3 Dulli release
    needs: [preflight, build, build_cli, build_android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download CLI archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      - name: Checksum CLI archives
        shell: bash
        run: |
          cd release-assets
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS

      - name: Download Android artifact
        uses: actions/download-artifact@v8
        with:
          name: mobile-android
          path: release-assets

      - name: Merge macOS updater manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for x64_manifest in release-assets/*-mac-x64.yml; do
            arm64_manifest="${x64_manifest%-x64.yml}.yml"
            if [[ -f "$arm64_manifest" ]]; then
              node scripts/merge-update-manifests.ts --platform mac "$arm64_manifest" "$x64_manifest"
              rm -f "$x64_manifest"
            fi
          done

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: T3 Dulli ${{ needs.preflight.outputs.tag }}
          prerelease: true
          make_latest: false
          # The action appends GitHub's generated changelog after this body.
          generate_release_notes: true
          previous_tag: ${{ needs.preflight.outputs.previous_tag }}
          body: |
            T3 Dulli community build from `YJJosh/t3code`, based on upstream v0.1.9.

            Install the CLI with `npm install -g t3-dulli`, then run `t3-dulli`.

            The Android APK is signed with the persistent Dulli community keystore but is not
            distributed through Google Play, so Android requires enabling installs from unknown
            sources and may show a Play Protect warning. It has OTA updates disabled; install
            newer releases manually.

            The macOS app has a persistent self-signed community signature but is not
            Apple-notarized, so macOS displays an unverified-developer warning on first launch.
            After copying it to Applications, approve it under
            **System Settings → Privacy & Security → Open Anyway**. If the installed copy predates
            persistent community signing, macOS will reject its built-in update once; manually
            replace the app with this release, and later signed updates can install normally.
            The Windows installer is unsigned and may display a Microsoft Defender SmartScreen
            warning; choose **More info → Run anyway** only if you trust this build.
          files: |
            release-assets/SHA256SUMS
            release-assets/*.tar.gz
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.apk
            release-assets/*.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
